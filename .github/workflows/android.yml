name: App Android (APK)

on:
  push:
    branches: [main, beta]
    paths:
      - 'android/**'
      - 'js/**'
      - 'css/**'
      - 'assets/**'
      - 'vendor/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

# main = production (app-android), beta = beta (app-android-beta, "Spindro Beta"). See docs/environments.md
env:
  CHANNEL: ${{ github.ref_name == 'beta' && 'beta' || 'prod' }}

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:web && npx cap sync android
        env:
          VERSION_CODE: ${{ github.run_number }}
      # the browser extension "Spindro Remote" (extension/, docs/extension.md) travels next to the APK: same release, stable download URL
      - name: Build the Spindro Remote extension zip
        run: npm run ext:zip
      - name: Prepare the release key (from GitHub Secrets)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/spindro-release.jks"
            {
              echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/spindro-release.jks"
              echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
              echo "SPINDRO_SIGNED=true"
            } >> "$GITHUB_ENV"
            echo "Release key found: signed RELEASE build (foss APK + Play AAB)."
          else
            echo "SPINDRO_SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning title=APK debug (fallback)::Secrets ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD are missing: building the DEBUG APK as before, no AAB."
          fi
      - name: Cache Gradle (distribution and dependencies)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Download Gradle (with retries if the server is slow)
        working-directory: android
        run: |
          for i in 1 2 3 4 5; do ./gradlew --version --no-daemon && exit 0; echo "attempt $i failed, retrying"; sleep $((i * 30)); done
          echo "::error::Could not download Gradle (distribution server unreachable)"; exit 1
      - name: Build (signed release, or debug if the Secrets are missing)
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          APK_NAME: ${{ github.ref_name == 'beta' && 'spindro-beta.apk' || 'spindro.apk' }}
        run: |
          if [ "$SPINDRO_SIGNED" = "true" ]; then
            ./gradlew assembleFossRelease bundlePlayRelease --no-daemon
            cp app/build/outputs/apk/foss/release/app-foss-release.apk ../$APK_NAME
            cp app/build/outputs/bundle/playRelease/app-play-release.aab ../spindro-play.aab
          else
            ./gradlew assembleFossDebug --no-daemon
            cp app/build/outputs/apk/foss/debug/app-foss-debug.apk ../$APK_NAME
          fi
          echo "Build ${VERSION_CODE} (versionName 1.0.${VERSION_CODE}), signed release: $SPINDRO_SIGNED" >> "$GITHUB_STEP_SUMMARY"
      - name: Delete the key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/spindro-release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: spindro-apk-${{ env.CHANNEL }}
          path: spindro*.apk
      # the AAB is only for uploading to Google Play by hand: it stays a run artifact and does NOT go into the public release
      - uses: actions/upload-artifact@v4
        if: env.SPINDRO_SIGNED == 'true'
        with:
          name: spindro-play-aab
          path: spindro-play.aab
          if-no-files-found: error
      # only main and beta publish: each channel has its own release
      - name: Publish the APK to the "app-android" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-android
          name: Spindro for Android
          make_latest: true
          files: |
            spindro.apk
            dist/spindro-remote.zip
          body: |
            Spindro for Android (build ${{ github.run_number }}).
            Open this page on your phone, download **spindro.apk** and install it
            (Android will ask you to allow installing from this source).
            Highlights: native Bluetooth and a bridge to Garmin (the phone becomes a power, cadence and speed sensor).
            **spindro-remote.zip** is the optional Chrome/Edge extension that lets the Zwift Click control a video in another tab: see docs/extension.md.
      - name: Publish the beta APK to the "app-android-beta" prerelease
        if: github.ref == 'refs/heads/beta'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-android-beta
          name: Spindro Beta for Android
          prerelease: true
          make_latest: false
          files: |
            spindro-beta.apk
            dist/spindro-remote.zip
          body: |
            **Spindro Beta** (build ${{ github.run_number }}): a test version that installs next to the stable app.
            Download **spindro-beta.apk** on your phone and install it. It may contain bugs: your real data stays in the stable app.
            **spindro-remote.zip** is the beta of the optional Chrome/Edge extension "Spindro Remote" (Zwift Click as a remote for a video in another tab): see docs/extension.md.
