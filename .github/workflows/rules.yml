name: Firestore rules and Cloud Functions

on:
  push:
    paths:
      - 'firebase/**'
      - 'functions/**'
      - 'firebase.json'
      - 'js/account/**'
      - 'js/config.js'
      - 'tests/account.spec.mjs'
      - '.github/workflows/rules.yml'
  pull_request:
    paths:
      - 'firebase/**'
      - 'functions/**'
      - 'firebase.json'
      - 'js/account/**'
      - 'js/config.js'
      - 'tests/account.spec.mjs'
      - '.github/workflows/rules.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regole:
    name: Rules tests (Firestore emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4   # the Firestore emulator is a .jar
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('firebase/package-lock.json') }}
      - run: npm ci
      - run: npm test

  functions:
    name: Cloud Functions (build and tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm test

  account:
    name: Account and sync (Playwright + Auth/Firestore emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4   # the Firestore emulator is a .jar
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('firebase/package-lock.json') }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm ci
        working-directory: firebase
      # the Firebase SDK is downloaded from gstatic (pinned version in js/config.js): this needs network access, which GitHub runners have
      - name: Account tests against the emulators
        working-directory: firebase
        run: >
          npx firebase emulators:exec --config ../firebase.json --project demo-spindro --only auth,firestore
          "cd .. && SPINDRO_EMULATOR=1 npx playwright test tests/account.spec.mjs --trace off"
