name: Beta, ripubblica il sito

# Un push su beta non può fare il deploy da solo (l'ambiente "github-pages" accetta solo il ramo predefinito):
# qui si avvia il workflow di pubblicazione dal ramo main, che costruisce /beta/ dal codice di beta.
on:
  push:
    branches: [beta]

permissions:
  actions: write

jobs:
  kick:
    runs-on: ubuntu-latest
    steps:
      - name: Avvia "Pubblica su GitHub Pages" da main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
