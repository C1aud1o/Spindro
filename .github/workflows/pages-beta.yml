name: Beta, republish the site

# A push to beta cannot deploy by itself (the "github-pages" environment only accepts the default branch):
# this starts the publish workflow from the main branch, which builds /beta/ from the code of beta.
on:
  push:
    branches: [beta]

permissions:
  actions: write

jobs:
  kick:
    runs-on: ubuntu-latest
    steps:
      - name: Start "Publish to GitHub Pages" from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
