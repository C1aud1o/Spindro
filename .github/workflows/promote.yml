name: Promote beta to production

# Porta main alla stessa punta di beta (fast-forward). Fallisce se main ha commit che beta non ha.
# Un push fatto col token del workflow non avvia gli altri workflow: per questo li lanciamo noi a mano alla fine.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward main to beta
        run: |
          git fetch origin main beta
          if git merge-base --is-ancestor origin/beta origin/main; then
            echo "main contiene già beta: niente da promuovere."; exit 0
          fi
          if ! git merge-base --is-ancestor origin/main origin/beta; then
            echo "::error::main non è un antenato di beta: non è un fast-forward. Fai prima il merge di main in beta, prova e riprova."; exit 1
          fi
          git push origin origin/beta:refs/heads/main
          echo "PROMOTED=true" >> "$GITHUB_ENV"
      - name: Avvia APK e sito da main
        if: env.PROMOTED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run android.yml --ref main
          gh workflow run pages.yml --ref main
