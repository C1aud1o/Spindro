name: Promote beta to production

# Moves main to the same tip as beta (fast-forward). Fails if main has commits that beta does not have.
# A push made with the workflow token does not start other workflows: that is why we start them by hand at the end.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward main to beta
        run: |
          git fetch origin main beta
          if git merge-base --is-ancestor origin/beta origin/main; then
            echo "main already contains beta: nothing to promote."; exit 0
          fi
          if ! git merge-base --is-ancestor origin/main origin/beta; then
            echo "::error::main is not an ancestor of beta: this is not a fast-forward. Merge main into beta first, test, and try again."; exit 1
          fi
          git push origin origin/beta:refs/heads/main
          echo "PROMOTED=true" >> "$GITHUB_ENV"
      - name: Start APK and site builds from main
        if: env.PROMOTED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run android.yml --ref main
          gh workflow run pages.yml --ref main
