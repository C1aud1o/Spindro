name: Publish to GitHub Pages

# One deploy always contains both environments (see docs/environments.md):
#   production (branch main): site at the root, app in /app/, APK in /app/spindro.apk
#   beta (branch beta):       app only in /beta/, APK in /beta/spindro-beta.apk (noindex)
# The deploy always starts from the main branch (the "github-pages" environment only accepts the default branch):
# a push to beta starts it through pages-beta.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # when a new APK is ready, publish again with the updated file
  workflow_run:
    workflows: ["App Android (APK)"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # after an Android build, publish again only if it was a successful build of main or beta
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && contains(fromJSON('["main","beta"]'), github.event.workflow_run.head_branch))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Does the beta branch exist?
        id: branches
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/branches/beta" --silent; then echo "beta=true" >> "$GITHUB_OUTPUT"; else echo "beta=false" >> "$GITHUB_OUTPUT"; echo "::notice::No beta branch: publishing production only"; fi
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/checkout@v4
        if: steps.branches.outputs.beta == 'true'
        with:
          ref: beta
          path: beta
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ---- production: from the code of main ----
      - name: Production app (web files only, without android/)
        working-directory: main
        run: |
          node scripts/copy-web.mjs
          [ -f www/sw.js ] || cp sw.js www/   # copy-web on main not updated yet
        env:
          CHANNEL: prod
          WEB_DEPLOY: '1'
          VERSION_CODE: web-${{ github.run_number }}
      - name: Production showcase site (site/dist)
        working-directory: main
        run: node site/build.mjs

      # ---- beta: from the code of beta ----
      - name: Beta app
        if: steps.branches.outputs.beta == 'true'
        working-directory: beta
        run: node scripts/copy-web.mjs
        env:
          CHANNEL: beta
          WEB_DEPLOY: '1'
          VERSION_CODE: web-${{ github.run_number }}

      # Published layout. To change the domain: CNAME on main and "siteUrl" in site/config.json.
      - name: Assemble pub/
        run: |
          rm -rf pub && mkdir -p pub/app
          cp -r main/site/dist/. pub/
          cp -r main/www/. pub/app/
          gh release download app-android -p spindro.apk -D pub/app --repo "$GITHUB_REPOSITORY" || echo "APK not available yet"
          [ -f pub/app/spindro.apk ] && cp pub/app/spindro.apk pub/app/ride-freedom.apk  # vecchi link
          if [ "${{ steps.branches.outputs.beta }}" = "true" ]; then
            mkdir -p pub/beta
            cp -r beta/www/. pub/beta/
            gh release download app-android-beta -p spindro-beta.apk -D pub/beta --repo "$GITHUB_REPOSITORY" || echo "beta APK not available yet"
          fi
          # /beta/ must not be indexed (besides the noindex meta in the app); this also holds when the robots.txt on main is older
          grep -q '^Disallow: /beta/' pub/robots.txt || printf 'User-agent: *\nDisallow: /beta/\n' >> pub/robots.txt
          cp main/CNAME pub/CNAME
          touch pub/.nojekyll
          ls -la pub pub/app pub/beta 2>/dev/null | head -60
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pub
      - id: deployment
        uses: actions/deploy-pages@v4
