<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:transparent}</style>
<script type="importmap">{"imports":{"three":"/vendor/three/three.module.min.js"}}</script>
<script type="module">
// Fotografa un modello in un'icona: stessa camera e stessa luce per tutte, sfondo trasparente. Uso: icon-render.html?m=nome
import * as THREE from 'three';
import { GLTFLoader } from '/vendor/three/addons/loaders/GLTFLoader.js';
const name = new URLSearchParams(location.search).get('m');
const SIZE = 256, SS = 2; // si disegna a 512 e si riduce a 256 (bordi più morbidi)
const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
r.setPixelRatio(1); r.setSize(SIZE * SS, SIZE * SS); r.setClearColor(0x000000, 0); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.05;
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xfff4e0, 0x6f7a99, 1.35));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(3, 5, 4); scene.add(key);
const rim = new THREE.DirectionalLight(0x9fd8ff, 0.9); rim.position.set(-4, 2, -3); scene.add(rim);
new GLTFLoader().load(`/scripts/meshy/work/${name}.glb`, g => {
  const root = g.scene; scene.add(root);
  const box = new THREE.Box3().setFromObject(root), c = box.getCenter(new THREE.Vector3());
  const sph = box.getBoundingSphere(new THREE.Sphere());
  const cam = new THREE.PerspectiveCamera(30, 1, 0.01, 1000);
  const az = 0.62, el = 0.32, D = sph.radius / Math.sin(THREE.MathUtils.degToRad(15)) * 0.94;
  cam.position.set(c.x + Math.sin(az) * Math.cos(el) * D, c.y + Math.sin(el) * D, c.z + Math.cos(az) * Math.cos(el) * D);
  cam.lookAt(c); r.render(scene, cam);
  const o = document.createElement('canvas'); o.width = o.height = SIZE; const x = o.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(r.domElement, 0, 0, SIZE, SIZE);
  window.__png = o.toDataURL('image/png'); window.__webp = o.toDataURL('image/webp', 0.9);
  document.title = 'ready';
});
</script>
