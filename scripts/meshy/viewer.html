<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:#8a94a0}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/vendor/three/three.module.min.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from '/vendor/three/addons/loaders/GLTFLoader.js';
const name = new URLSearchParams(location.search).get('m');
const W = 1500, Hh = 500;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(W, Hh); document.body.appendChild(r.domElement);
r.setScissorTest(true); r.setClearColor(0x8a94a0);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x666677, 1.6));
const d = new THREE.DirectionalLight(0xffffff, 2); d.position.set(3, 5, 4); scene.add(d);
new GLTFLoader().load(`/assets/3d/meshy/${name}.glb`, g => {
  scene.add(g.scene);
  const box = new THREE.Box3().setFromObject(g.scene), c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
  const R = Math.max(s.x, s.y, s.z) * 1.15;
  const cam = new THREE.PerspectiveCamera(35, 1, 0.01, 1000);
  [[0, 0], [Math.PI / 2, 0], [Math.PI / 4, 0.3]].forEach(([az, el], i) => {
    r.setViewport(i * 500, 0, 500, Hh); r.setScissor(i * 500, 0, 500, Hh);
    cam.position.set(c.x + Math.sin(az) * Math.cos(el) * R * 2.2, c.y + Math.sin(el) * R * 2.2, c.z + Math.cos(az) * Math.cos(el) * R * 2.2);
    cam.lookAt(c); r.render(scene, cam);
  });
  document.title = 'ready ' + s.x.toFixed(2) + 'x' + s.y.toFixed(2) + 'x' + s.z.toFixed(2);
});
</script>
