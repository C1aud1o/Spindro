<div class="wrap">
  <article class="prose post">
    <p class="crumb"><a href="{{blogUrl}}">&larr; {{blog.back}}</a></p>
    <h1>{{postTitle}}</h1>
    <p class="meta"><time datetime="{{postDate}}">{{postDateText}}</time> · {{postRead}}</p>
    {{{postBody}}}
    <aside class="try">
      <h2>{{blog.tryTitle}}</h2>
      <p>{{blog.tryText}}</p>
      <div class="btns"><a class="btn primary" href="{{appUrl}}">{{cta.app}}</a><a class="btn" href="{{androidUrl}}" rel="noopener">{{cta.android}}</a><a class="btn ghost" href="{{compatUrl}}">{{nav.compat}}</a></div>
    </aside>
    {{{moreCards}}}
  </article>
</div>
